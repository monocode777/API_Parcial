<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Videojuegos API</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>🎮 Login</h1>
                <p>Accede a la API de Videojuegos</p>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <button type="submit" class="login-button">Iniciar Sesión</button>
            </form>
            
            <div id="message" class="error-message"></div>
            
            <div id="resultContainer" class="result-container" style="display: none;">
                <div id="tokenDisplay" class="token-display"></div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('message').className = 'success-message';
                    document.getElementById('message').textContent = '¡Login exitoso!';
                    
                    document.getElementById('resultContainer').style.display = 'block';
                    document.getElementById('tokenDisplay').textContent = data.access_token;
                } else {
                    document.getElementById('message').className = 'error-message';
                    document.getElementById('message').textContent = data.error || 'Error al iniciar sesión';
                    
                    document.getElementById('resultContainer').style.display = 'block';
                    document.getElementById('resultContainer').innerHTML = `
                        <img src="https://i.giphy.com/media/Ju7l5y9osyymQ/giphy.webp" alt="Error meme" style="max-width: 100%;">
                    `;
                }
            } catch (error) {
                document.getElementById('message').className = 'error-message';
                document.getElementById('message').textContent = 'Error de conexión';
            }
        });
    </script>
</body>
</html>

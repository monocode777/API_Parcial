<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Videojuegos API</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>🎮 Login</h1>
                <p>Accede a la API de Videojuegos</p>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <button type="submit" class="login-button">Iniciar Sesión</button>
            </form>
            
            <div id="message" class="error-message" aria-live="polite"></div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const messageEl = document.getElementById('message');
            messageEl.textContent = '';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok && data.access_token) {
                    // Guardar token y user en localStorage y redirigir a /home
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('user', JSON.stringify(data.user || {}));
                    // redirigir al dashboard
                    window.location.href = '/home';
                } else {
                    messageEl.className = 'error-message';
                    messageEl.textContent = data.error || 'Error al iniciar sesión';
                }
            } catch (error) {
                messageEl.className = 'error-message';
                messageEl.textContent = 'Error de conexión';
            }
        });
    </script>
</body>
</html>
